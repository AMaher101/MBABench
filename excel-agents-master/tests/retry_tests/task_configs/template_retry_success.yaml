# Retry Test 1: SUCCESS on first attempt
# Creates both required sheets (model + answers) so validation passes immediately.
# Expected: task_status=success, 1 JSON file per task, 0 retries.

template:
  agent_type: "claude_excel_agent"

  file_path:
    - "My files"
    - "YOUR_PROJECT_ID"
    - "main_tasks"

  prompt_version: 2

  prompts:
    - "Create a new sheet called 'model_1' and write 'Retry test - success' in cell A1."
    - "Create a new sheet called 'answers' and write 'Test answers' in cell A1."

  finished_works_file: "test_works.txt"

  claude_excel_agent:
    skip_file_upload: true
    max_sec_per_task: 600
    max_agent_attempts: 2
    max_total_attempts: 2

    browser:
      type: "chrome"
      headless: false
      timeout: 10000

    check_interval_seconds: 30
    max_wait_per_prompt_seconds: 60

    logging:
      level: "DEBUG"
      save_to_file: true
      log_directory: "claude_logs"

    runtime:
      no_hold: true
      kill_all_browsers: false
