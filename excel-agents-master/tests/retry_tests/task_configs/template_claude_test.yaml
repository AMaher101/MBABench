# Claude Agent Test Template - Simple prompts to verify web search disable
# Uses the commented-out test prompts from template_claude.yaml

template:
  agent_type: "claude_excel_agent"

  file_path:
    - "My files"
    - "YOUR_PROJECT_ID"
    - "main_tasks"

  # Prompt version (recorded in JSON completion logs for tracking)
  prompt_version: 2

  # Simple test prompts (from template_claude.yaml comments)
  prompts:
    - "Create a new sheet called 'Test'"
    - "On the 'Test' sheet, write the word 'Headless False'"
    - "Under that, write the names of all the attached files.  If no attachments, write 'No attachments'."

  finished_works_file: "test_works.txt"

  # Claude-specific settings
  claude_excel_agent:
    max_sec_per_task: 600  # 10 min - short timeout for test
    max_agent_attempts: 3   # Max attempts where the agent actually ran
    max_total_attempts: 10  # Hard cap across all failure types (pipeline + agent)

    browser:
      type: "chrome"
      headless: false
      timeout: 10000

    check_interval_seconds: 30
    max_wait_per_prompt_seconds: 60

    logging:
      level: "DEBUG"  # DEBUG for test to see web search disable logs
      save_to_file: true
      log_directory: "claude_logs"

    runtime:
      no_hold: true
      kill_all_browsers: false
