# Task-Source Shorthand Format
# =============================================
# Use this format when all of your tasks share a common parent folder on
# OneDrive and on disk. Instead of listing paths per task, you declare a
# single `task_source`, and the runner derives each task's paths from the
# source plus its `task_name`.
#
# See sample_tasks.yaml for the fully explicit, per-task format.
#
# --- How navigation works ---
#   OneDrive path = file_path (template) + task_source + task_name + "Task"
#   The `task_source` name doubles as the OneDrive subfolder name, except
#   `wallstreetprep` maps to `wsp/`. Add new sources by extending the mapping
#   in `excel_agent/core/navigation.py` and `excel_agent/core/file_manager.py`.
#
# --- How local file upload works ---
#   Files are read from: main_tasks/{source}/{task_name}/Task/
#   The pre-existing workbook is auto-detected by source convention:
#     fmwc           -> *model.xlsx
#     modeloff       -> first .xlsx / .xlsm
#     wallstreetprep -> *-before.xlsx
#   Every other file in the Task/ folder (PDFs, data files, etc.) is
#   uploaded to the add-in panel automatically.

task_source: "modeloff"

tasks:
  - task_name: "Round 1 - Section 1 - MCQ"
  - task_name: "Round 1 - Section 2 - MCQ"
