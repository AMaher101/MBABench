# TabAI Agent — Template Configuration
# =====================================
# This file defines AGENT settings shared across all tasks.
# Task-specific settings (navigation, files, output) go in your tasks YAML.
#
# See tasks_configs/examples/sample_tasks.yaml for task list format.

template:
  agent_type: "tabai"

  # Base directory for resolving upload_files paths in your tasks YAML.
  # If omitted, paths are resolved from the current working directory.
  # local_files_base: "project_data/"

  # LEGACY: OneDrive base path (only needed for v1 task format)
  file_path:
    - "My files"
    - "YOUR_PROJECT_ID"
    - "main_tasks"

  # Prompt version (recorded in JSON completion logs for tracking)
  prompt_version: 1

  # Prompts — sent sequentially to the AI agent.
  # Replace with your own instructions. These are generic placeholders.
  prompts:
    - "Analyze the attached files. Summarize the key data and questions to answer."
    - "Build an Excel solution on a new sheet. Use formulas (no hardcoded values) and organize the workbook clearly."
    - "Create a summary sheet with your final answers and conclusions."

  # Optional: File to save completed task URLs (default: None, no URL logging)
  # finished_works_file: "completed_tasks.txt"

  # Retry settings
  retry:
    max_agent_attempts: 3       # Max attempts where the agent actually ran
    max_pipeline_attempts: 10   # Hard cap including infrastructure failures
    timeout_per_task_seconds: 5400  # 90 minutes

  # TabAI-specific settings
  tabai:
    max_sec_per_task: 5400  # 90 min (1.5 hour) timeout
    max_agent_attempts: 3   # Max attempts where the agent actually ran
    max_total_attempts: 10  # Hard cap across all failure types (pipeline + agent)

    browser:
      type: "firefox"   # Options: "chromium", "firefox", "webkit", "chrome"
      headless: false
      timeout: 10000

    check_interval_seconds: 60
    max_wait_per_prompt_seconds: 1800

    logging:
      level: "INFO"
      save_to_file: true
      log_directory: "tabai_logs"

    runtime:
      no_hold: true
      kill_all_browsers: false
