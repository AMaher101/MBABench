# Claude Excel Agent — Template Configuration
# =============================================
# This file defines AGENT settings shared across all tasks.
# Task-specific settings (navigation, files, output) go in your tasks YAML.
#
# See tasks_configs/examples/sample_tasks.yaml for task list format.

template:
  agent_type: "claude_excel_agent"

  # ──────────────────────────────────────────────────────────────
  # LOCAL FILES BASE (optional)
  # ──────────────────────────────────────────────────────────────
  # Base directory for resolving upload_files paths in your tasks YAML.
  # If omitted, paths are resolved from the current working directory.
  # local_files_base: "project_data/"

  # ──────────────────────────────────────────────────────────────
  # LEGACY: OneDrive base path (only needed for v1 task format)
  # ──────────────────────────────────────────────────────────────
  # If your tasks YAML uses task_source instead of onedrive_path,
  # this base path + task_source + task_name + "Task" builds the path.
  file_path:
    - "My files"
    - "YOUR_PROJECT_ID"
    - "main_tasks"

  # Prompt version (recorded in JSON completion logs for tracking)
  prompt_version: 2

  # ──────────────────────────────────────────────────────────────
  # PROMPTS
  # ──────────────────────────────────────────────────────────────
  # Sent sequentially to the AI agent. Replace with your own instructions.
  # These are generic placeholders — write prompts specific to YOUR task.
  prompts:
    - "Analyze the attached files. Summarize the key data and questions to answer."
    - "Build an Excel solution on a new sheet. Use formulas (no hardcoded values) and organize the workbook clearly."
    - "Create a summary sheet with your final answers and conclusions."

  # ──────────────────────────────────────────────────────────────
  # RETRY SETTINGS
  # ──────────────────────────────────────────────────────────────
  retry:
    max_agent_attempts: 3       # Max attempts where the agent actually ran
    max_pipeline_attempts: 10   # Hard cap including infrastructure failures
    timeout_per_task_seconds: 7200  # 2 hours

  # ──────────────────────────────────────────────────────────────
  # CLAUDE-SPECIFIC SETTINGS
  # ──────────────────────────────────────────────────────────────
  claude_excel_agent:
    # Model selection (optional). Options: opus_4_6, sonnet_4_6
    # If null or omitted, uses the currently active model in the add-in.
    model: null

    max_sec_per_task: 7200  # 2 hour timeout
    max_agent_attempts: 3
    max_total_attempts: 10

    browser:
      type: "chrome"
      headless: false
      timeout: 10000

    check_interval_seconds: 60
    max_wait_per_prompt_seconds: 7200

    logging:
      level: "INFO"
      save_to_file: true
      log_directory: "claude_logs"

    runtime:
      no_hold: true
      kill_all_browsers: false
