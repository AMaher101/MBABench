# ChatGPT Excel Agent — Template Configuration
# ==============================================
# This file defines AGENT settings shared across all tasks.
# Task-specific settings (navigation, files, output) go in your tasks YAML.
#
# See tasks_configs/examples/sample_tasks.yaml for task list format.

template:
  agent_type: "chatgpt_excel_agent"

  # Base directory for resolving upload_files paths in your tasks YAML.
  # If omitted, paths are resolved from the current working directory.
  # local_files_base: "project_data/"

  # LEGACY: OneDrive base path (only needed for v1 task format)
  file_path:
    - "My files"
    - "YOUR_PROJECT_ID"
    - "main_tasks"

  # Prompt version (recorded in JSON completion logs for tracking)
  prompt_version: 3

  # Prompts (shared across all agents)
  prompts:
    - "You are an expert financial modeling agent. Your task is to create Excel/spreadsheet workbooks against the following rubric for which you will be evaluated against. Note each criterion and ensure the workbook meets the \"good\" and avoids the \"bad\" standard described.\n\n\
      ACCURACY\n\
      Final Calculations Check whether the final calculations of the sheet are accurate with the given inputs and case context.\n\
      Good: Calculations are accurate and match the given inputs and case context.\n\
      Bad: Calculations are incorrect or missing.\n\
      Starting Values Check whether the workbook uses the correct input values given in the case context.\n\
      Good: Workbook uses the correct input values given in the case context.\n\
      Bad: Workbook uses incorrect input values given in the case context.\n\
      Task Completed Check whether the workbook completes the task given in the case context.\n\
      Good: Workbook completes the task given in the case context.\n\
      Bad: Workbook does not complete the task given in the case context.\n\
      Number Sign Consistency Check whether negative calculations are consistent. (e.g. if CapEX is represented as negative on one place it should be everywhere, and if cost/spending is represented as positive on one place, then it should be added up if calculating for cost, or subtracted if calculating for revenue). IMPORTANT: If no calculations exist because the work was not completed, this check FAILS.\n\
      Good: Negative calculations are consistent across all sheets.\n\
      Bad: Negative calculations are inconsistent, OR no calculations exist because the model was not completed.\n\n\
      FORMULA\n\
      Logic Readability & Size Check whether formulas are clear and understandable, using helper columns to break complex calculations into logical steps. Named ranges improve clarity for reusable models. Avoid monolithic 'mega-formulas' that obscure logic and make debugging difficult. There should not be duplicated/repeated/unnecessary calculations.\n\
      Good: Complex calculations split into multiple helper columns showing intermediate steps. Named ranges used for inputs. Formula intent is immediately clear. Easy to audit and debug.\n\
      Bad: Monolithic nested formulas with multiple functions that obscure logic. No helper columns when clearly needed. Difficult to understand intent or debug errors.\n\
      Handle Edge Cases Proper error traps (IFERROR or equivalent) where lookups/divisions, especially divisions referred from the assumption table, can fail. For financial statement types, IFERROR should not apply. Error traps should return a clear error message to the user. Workbook should include error handling and checks (e.g., balance sheet balance, circularity flags) to ensure the model does not break silently.\n\
      Good: Error traps (IFERROR or equivalent) properly implemented where lookups/divisions can fail. Dedicated error checks clearly formatted for quick identification.\n\
      Bad: Missing error traps where lookups/divisions can fail. No checks or error indicators; model may break silently.\n\
      Avoid Hardcoding Inputs and constants must reference input cells; no external/off-Excel calculations; no buried constants in formulas.\n\
      Good: All inputs and constants reference input cells; no external calculations; no buried constants.\n\
      Bad: Hard-coded values in formulas; external/off-Excel calculations; buried constants.\n\
      Range Hygiene Ranges should be dynamic (automatically expand/contract as data changes) using Tables, OFFSET, INDEX, or structured references. Do not reference entire columns like A:A when an exact or dynamic range is appropriate. Prevents formulas from breaking when rows/columns are inserted and ensures all data is captured in calculations, especially for time-series types of models. Financial statement types of models can be excluded from failing this criterion.\n\
      Good: All data ranges use Excel Tables or dynamic formulas (OFFSET, INDEX/MATCH). Charts, pivot tables, and summary formulas automatically include new data. No manual range updates needed when model expands. No entire column references.\n\
      Bad: Hardcoded static ranges throughout. Adding rows breaks formulas or excludes data from calculations. Charts and summaries miss new entries. Requires constant manual range adjustments. Frequent entire-column references.\n\
      Using Absolute References When constant/input cells are to be used (and a relative reference would corrupt logic), check whether the cells are locked with absolute references ($) so they do not shift when formulas are copied.\n\
      Good: All references to assumption tables, lookup ranges and other constants use absolute references. Formulas can be copied anywhere without breaking logic. The model recalculates correctly when assumptions change.\n\
      Bad: Frequent use of relative references where absolutes are needed. Copying formulas breaks calculations. Assumption changes do not flow through properly. #REF! errors or silent calculation errors present.\n\n\
      FORMATTING\n\
      Workbook & Sheet Structure Check for sensible sheet flow (Inputs/Assumptions -> Workings -> Outputs); precise sectioning with descriptive tab names and a clear separation between outputs and inputs, and consistent structure.\n\
      Good: Sensible sheet flow from Inputs/Assumptions to Workings to Outputs; precise sectioning - clear separation of Inputs, Calculations, and Outputs; consistent tab naming conventions (e.g., \"Assumptions\", \"Model\", \"Summary\").\n\
      Bad: Poor sheet flow / inconsistent ordering; unclear sectioning - no clear separation between inputs, calculations, and outputs; tabs unnamed or default.\n\
      Readability Sheet layout should facilitate easy navigation and comprehension. Freeze panes keep headers visible while scrolling for tables with more than 26 columns or more than 60 rows. Consistent spacing, clear labels with correct units, and legends make data immediately interpretable.\n\
      Good: Freeze panes applied appropriately. Consistent row/column spacing throughout. Precise titles and subtitles. All values labeled with correct units. Legends provided where needed.\n\
      Bad: No freeze panes where needed. Inconsistent or cramped spacing. Missing labels, units, or legends. Difficult to navigate or interpret data without significant effort.\n\
      Use of Color Standards Consistent color coding distinguishes inputs, formulas, and linked cells at a glance. Industry-standard schemes (example font colors: blue=inputs, black=formulas, green=links, orange=checks, make sure these are font color, not color fill) improve navigation and reduce errors by making cell types immediately recognizable.\n\
      Good: Consistent font color key applied throughout the entire model. Industry-standard scheme followed (example: blue=inputs, black=formulas, green=links, orange=checks). Cell purpose immediately clear from color alone.\n\
      Bad: Inconsistent or no color key. Input cells left unformatted or randomly colored. Makes it unclear which cells are inputs versus formulas. No standard followed, forcing users to click into cells to determine type.\n\
      Number Notation (finance standards) Numbers formatted per finance standards: currency symbols, thousand separators, percentages with decimals, negatives in parentheses, consistent precision, date formats consistent, and right-aligned. Units may appear in adjacent cells.\n\
      Good: Currency with symbols and thousand separators. Percentages with appropriate decimals. Negatives in parentheses. Consistent decimal precision by measure type. Consistent date formats. Numbers right-aligned. Units clearly labeled in adjacent cells when applicable.\n\
      Bad: Missing currency symbols or thousand separators. Incorrect percentage formatting. Negatives shown with minus signs instead of parentheses. Inconsistent decimal precision within same measure. Inconsistent date formats. Poor number alignment.\n\
      Information Alignment Columns and rows of the same type of information should be aligned vertically. There should be a logical flow in the alignment of different calculations. Subtitles/categories/calculation names should be aligned with their respective values.\n\
      Good: Columns and rows of the same type aligned vertically; logical flow in alignment of calculations; subtitles/categories/calculation names aligned with respective values.\n\
      Bad: Poor vertical alignment of similar information; illogical flow in calculation alignment; subtitles/categories/calculation names misaligned with values.\n\
      Consistency of Styles Should use consistent sans serif fonts, sizes, boldness, etc. across all sheets for the respective information type. The judge must compare styles across different sheets, not just within a single sheet.\n\
      Good: The same font family and sizing are used consistently across all sheets for headers, labels, and data cells. If multiple sheets exist, they all follow the same style conventions.\n\
      Bad: Different sheets use different font families or styles for comparable content. Multiple fonts, font sizes, and inconsistent bold/italics; headings not distinct.\n\
      Use of Borders & Shading Coloring and shading of subtitles, headers, and titles should be consistent and representative of conventional standards or firm-provided templates. Borders should be in proper places to partition information and should not be excessively used.\n\
      Good: Borders used sparingly to separate sections; shading used only for emphasis, a professional, uncluttered look.\n\
      Bad: Excessive borders; shading used for all sections; headings not distinct.\n\
      Presentation of Outputs / Summaries Workbook should include clear output/summaries/answers/conclusion/Outputs/Results tab.\n\
      Good: Outputs and key metrics clearly presented in summary dashboards/tables.\n\
      Bad: No clear summary for end-users."
    - "I will be giving you a task in three steps. Your only allowed method for solving this problem is by building an Excel Model using the currently opened sheet, its provided data if any, and any files I attached. You must not use any external or internal tools, like a code interpreter or calculator, to find the final answers. The Excel file you build must be the only thing performing the calculations."
    - "Your first task is to analyze the attached problem statement and data file(s) and output them in a new sheet called 'Summary'. Do not build the model yet. Provide a brief summary of 1. The primary questions to answer. 2. The key inputs and assumptions. 3. A high-level plan for solving it. Confirm when you have completed this analysis."
    - "Your next step is actually making the model.  Create a new Excel sheet called 'model_main'. All logic should be on this 'model_main' tab.  If you need additional sheets, you can create them in the name of 'model_{number}' where the number is an incrementing number (e.g. 'model_1', 'model_2', etc.). Adhere to these standards: professional formatting, robust (inputs in separate cells, no hard-coding in formulas), accurate, and tractable.  For example, this model should be up to the standards and presentation abilities of a white-collar worker in a top professional services firm. Let me know when the model is complete."
    - "Your final task is to create the answers sheet. Create a new tab named 'answers_final'. On this sheet, present the final answers to all questions. Every single answer on this sheet must be directly referenceable to your 'model_main' sheet (or other 'model_' sheets). Hard coded values are to be generally avoided on the answers sheet. If you need additional answer sheets, name them 'answers_1', 'answers_2', etc."


  # Optional: File to save completed task URLs (default: None, no URL logging)
  # finished_works_file: "completed_tasks.txt"

  # Retry settings
  retry:
    max_agent_attempts: 3       # Max attempts where the agent actually ran
    max_pipeline_attempts: 10   # Hard cap including infrastructure failures
    timeout_per_task_seconds: 7200  # 2 hours

  # ChatGPT-specific settings
  chatgpt_excel_agent:
    # Reasoning mode selection (optional). Options: fast, standard, heavy
    # Defaults to "heavy" if not set.
    model: heavy

    max_sec_per_task: 7200  # 2 hour timeout
    max_agent_attempts: 3   # Max attempts where the agent actually ran
    max_total_attempts: 10  # Hard cap across all failure types (pipeline + agent)

    browser:
      type: "chrome"   # Chrome (uses Chrome Canary binary via CDP)
      headless: false
      timeout: 10000

    check_interval_seconds: 60
    max_wait_per_prompt_seconds: 7200

    logging:
      level: "INFO"
      save_to_file: true
      log_directory: "chatgpt_logs"

    runtime:
      no_hold: true
      kill_all_browsers: false
